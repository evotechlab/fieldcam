<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">

<title>FieldCam - Test Upgrade</title>
    
    <!-- PWA & Icone -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>


    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let token = null;
            
            
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const queryParams = new URLSearchParams(window.location.search.substring(1));
            
            // Cerchiamo le parole chiave usate da Dropbox o Cloudflare
            token = hashParams.get("access_token") || queryParams.get("access_token") || hashParams.get("token") || queryParams.get("token");
            
            if (token) {
                
                localStorage.setItem("db_access", token);
                localStorage.setItem("dropbox_access_token", token);
                localStorage.setItem("dropboxToken", token);             
               
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        // VIGILE URBANO
window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get("code");
    
    if (code) {
        // Scopre da quale app era partito (O&M o Quality)
        const paginaPartenza = localStorage.getItem('pagina_partenza') || 'om.html';
        
        // Rimbalza l'utente portandosi dietro il codice segreto
        window.location.href = paginaPartenza + "?code=" + code;
    }
});

        
    </script>
    
</head>
